<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">لوحة الإدارة</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <button id="logout-btn" class="btn-secondary" style="display: none;">تسجيل الخروج</button>
        </nav>
    </header>

    <main class="container admin-container">
        <!-- قسم تسجيل الدخول -->
        <div id="login-section" class="form-container">
            <h2>تسجيل دخول الأدمن</h2>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">دخول</button>
            </form>
            <div id="login-message"></div>
        </div>

        <!-- قسم لوحة التحكم -->
        <div id="dashboard-section" style="display: none;">
            <div class="admin-tabs">
                <button class="tab-btn active" data-status="pending">قيد المراجعة</button>
                <button class="tab-btn" data-status="published">المنشورة</button>
                <button class="tab-btn" data-status="rejected">المرفوضة</button>
            </div>

            <div id="admin-stories-list" class="admin-stories-grid">
                <!-- سيتم حقن القصص هنا -->
            </div>
        </div>

        <!-- قسم تعديل القصة (مخفي افتراضياً) -->
        <div id="edit-section" class="form-container" style="display: none;">
            <h2 style="margin-bottom: 20px; text-align: center;">تعديل بيانات القصة</h2>
            <form id="edit-story-form">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="edit-title">عنوان القصة:</label>
                    <input type="text" id="edit-title" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-author">اسم الكاتب:</label>
                    <input type="text" id="edit-author" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-category">التصنيف:</label>
                    <select id="edit-category" required>
                        <option value="رعب">رعب</option>
                        <option value="دراما">دراما</option>
                        <option value="خيال علمي">خيال علمي</option>
                        <option value="رومانسي">رومانسي</option>
                        <option value="تاريخي">تاريخي</option>
                        <option value="غموض">غموض</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="edit-content">نص القصة (مع روابط الصور):</label>
                    <!-- تم جعل اتجاه النص من اليسار لليمين لتسهيل قراءة روابط الصور وأكواد الـ HTML -->
                    <textarea id="edit-content" rows="15" required style="direction: ltr; text-align: left; background-color: #111; font-family: monospace;"></textarea>
                    <small style="color: #ff9800;">ملاحظة: النص هنا يظهر بصيغة HTML (ستجد روابط الصور بداخل وسم `<img>`). يمكنك استبدال الرابط المتعطل برابط جديد مباشرة.</small>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-secondary" id="cancel-edit-btn" style="flex: 1;">إلغاء التعديل</button>
                    <button type="submit" class="btn-primary" style="flex: 2;">حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
