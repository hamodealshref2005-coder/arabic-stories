<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكتب قصتك</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">منصة القصص</div>
        <nav>
            <a href="index.html">الرئيسية</a>
        </nav>
    </header>

    <main class="container form-container">
        <h1>اكتب قصتك وشاركها مع العالم</h1>
        <p class="form-subtitle">لن يتم نشر القصة حتى تتم مراجعتها من قبل الإدارة.</p>
        
        <form id="create-story-form">
            <div class="form-group">
                <label for="title">عنوان القصة:</label>
                <input type="text" id="title" placeholder="اكتب عنواناً جذاباً" required>
            </div>
            
            <div class="form-group">
                <label for="author">اسم الكاتب:</label>
                <input type="text" id="author" placeholder="اسمك أو اسم مستعار" required>
            </div>
            
            <div class="form-group">
                <label for="category">التصنيف:</label>
                <select id="category" required>
                    <option value="" disabled selected>اختر التصنيف المناسب</option>
                    <option value="رعب">رعب</option>
                    <option value="دراما">دراما</option>
                    <option value="خيال علمي">خيال علمي</option>
                    <option value="رومانسي">رومانسي</option>
                    <option value="تاريخي">تاريخي</option>
                    <option value="غموض">غموض</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="image">صورة الغلاف:</label>
                <input type="file" id="image" accept="image/png, image/jpeg, image/jpg" required>
                <small>اختر صورة واضحة تعبر عن قصتك (يفضل أن تكون عرضية).</small>
            </div>
            
            <div class="form-group">
                <label for="content">نص القصة:</label>
                <textarea id="content" rows="15" placeholder="اكتب أحداث قصتك هنا..." required></textarea>
            </div>
            
            <button type="submit" class="btn-primary" id="submit-btn">إرسال القصة للمراجعة</button>
        </form>
        
        <div id="message-box"></div>
    </main>

    <!-- تم التعديل هنا: إضافة type="module" -->
    <script type="module" src="js/create.js"></script>
</body>
</html>
