<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة القصص العربية</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">منصة القصص</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="#most-viewed">الأكثر مشاهدة</a>
            <a href="#latest">أحدث القصص</a>
            <a href="#all-stories">كل القصص</a>
            <a href="admin.html" style="color: var(--primary-color); font-weight: bold;">لوحة الإدارة</a>
        </nav>
        <a href="create.html" class="btn-primary">اكتب قصتك</a>
    </header>

    <section id="most-viewed">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>الأكثر مشاهدة</h2>
            <button id="toggle-most-viewed" class="btn-secondary" style="padding: 4px 12px; font-size: 12px; border-radius: 20px;">عرض الكل</button>
        </div>
        <div class="stories-grid">
            <p>جاري تحميل القصص...</p>
        </div>
    </section>

    <section id="latest">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>أحدث القصص</h2>
            <button id="toggle-latest" class="btn-secondary" style="padding: 4px 12px; font-size: 12px; border-radius: 20px;">عرض الكل</button>
        </div>
        <div class="stories-grid">
            <p>جاري تحميل القصص...</p>
        </div>
    </section>

    <section id="all-stories">
        <div class="section-header">
            <h2>كل القصص</h2>
        </div>
        <div class="stories-feed" id="all-stories-container">
            <p>جاري تحميل القصص...</p>
        </div>
    </section>

    <script type="module" src="js/home.js"></script>
</body>
</html>
