<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة القصة</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">منصة القصص</div>
        <nav>
            <a href="index.html">الرئيسية</a>
        </nav>
        <a href="create.html" class="btn-primary">اكتب قصتك</a>
    </header>

    <main class="container story-page">
        <!-- الصورة مخفية افتراضياً حتى يتم جلبها -->
        <img src="" alt="غلاف القصة" id="story-image" class="story-cover-img" style="display: none;">
        
        <div class="story-header-info">
            <h1 id="story-title">جاري تحميل القصة...</h1>
            <!-- التفاصيل مخفية افتراضياً -->
            <div class="story-meta" id="story-meta" style="display: none;">
                <span class="author" id="story-author"></span>
                <span class="category" id="story-category"></span>
                <div class="stats">
                    <span id="story-views">👁️ 0</span>
                    <span id="story-likes">❤️ 0</span>
                </div>
            </div>
            <button id="like-btn" class="btn-secondary" style="display: none;">أعجبتني ❤️</button>
        </div>

        <div class="story-content" id="story-content">
            <p>الرجاء الانتظار، يتم جلب تفاصيل القصة...</p>
        </div>
    </main>

    <script type="module" src="js/story.js"></script>
</body>
</html>
